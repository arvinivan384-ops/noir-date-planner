<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noir · Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 10%, #1f1129, #0b0710);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            padding: 40px 20px;
            color: #f2ebe6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            background: linear-gradient(135deg, #fcf5f0 20%, #eecf8f 55%, #e8829f 85%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #eecf8f, #d9b25f);
            color: #1a0f18;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(217, 178, 95, 0.3);
        }

        .btn-danger {
            background: #e8829f;
            color: #1a0f18;
        }

        .btn-danger:hover {
            background: #f09bb5;
            transform: scale(1.02);
        }

        .btn-danger:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d6c9d6;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-success {
            background: #8fd0a5;
            color: #1a0f18;
        }

        .btn-success:hover {
            background: #a8dfbb;
            transform: scale(1.02);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 18px 20px;
            backdrop-filter: blur(4px);
        }

        .stat-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6a5a6a;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 600;
            color: #fcf5f0;
            margin-top: 4px;
        }

        .stat-card .value.gold { color: #eecf8f; }
        .stat-card .value.pink { color: #e8829f; }
        .stat-card .value.green { color: #8fd0a5; }

        .table-container {
            background: rgba(20, 14, 27, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(4px);
            margin-bottom: 30px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 10px;
        }

        .table-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: #fcf5f0;
        }

        .table-header .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .table-scroll {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: rgba(255, 255, 255, 0.03);
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6a5a6a;
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            color: #d6c9d6;
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        tr.selected td {
            background: rgba(232, 130, 159, 0.08);
        }

        .checkbox-cell {
            width: 40px;
            text-align: center;
        }

        .checkbox-cell input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #eecf8f;
            cursor: pointer;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .status-yes {
            background: rgba(217, 178, 95, 0.2);
            color: #eecf8f;
            border: 1px solid rgba(217, 178, 95, 0.2);
        }

        .status-opened {
            background: rgba(142, 208, 165, 0.15);
            color: #8fd0a5;
            border: 1px solid rgba(142, 208, 165, 0.2);
        }

        .status-pending {
            background: rgba(232, 130, 159, 0.12);
            color: #e8829f;
            border: 1px solid rgba(232, 130, 159, 0.15);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #e8829f;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: rgba(232, 130, 159, 0.15);
            color: #f09bb5;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            background: #1a1122;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f2ebe6;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            backdrop-filter: blur(8px);
            z-index: 1000;
            animation: slideUp 0.3s ease forwards;
            max-width: 400px;
        }

        .toast.success { border-color: #8fd0a5; }
        .toast.error { border-color: #e8829f; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast.hidden {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6a5a6a;
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h3 { color: #d6c9d6; margin-bottom: 8px; }

        @media (max-width: 768px) {
            body { padding: 20px 12px; }
            .header h1 { font-size: 24px; }
            .stats { grid-template-columns: 1fr 1fr; }
            .table-header { flex-direction: column; align-items: stretch; }
            .table-header .actions { justify-content: stretch; }
            .btn { padding: 8px 14px; font-size: 11px; }
            td, th { padding: 10px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>✦ NOIR · Admin Dashboard</h1>
        <div class="header-actions">
            <a href="/" class="btn btn-outline">← Back to Home</a>
            <button class="btn btn-primary" onclick="refreshData()">↻ Refresh</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats">
        <div class="stat-card">
            <div class="label">Total Responses</div>
            <div class="value gold" id="totalCount">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Said YES</div>
            <div class="value green" id="yesCount">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Opened</div>
            <div class="value pink" id="openedCount">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Pending</div>
            <div class="value" id="pendingCount" style="color:#6a5a6a;">0</div>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">
        <div class="table-header">
            <h2>📋 Live Responses</h2>
            <div class="actions">
                <span style="font-size:12px; color:#6a5a6a;" id="selectedCount">0 selected</span>
                <button class="btn btn-success" onclick="selectAll()">✓ Select All</button>
                <button class="btn btn-danger" id="deleteSelectedBtn" onclick="deleteSelected()" disabled>
                    🗑️ Delete Selected
                </button>
            </div>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th class="checkbox-cell">
                            <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()" />
                        </th>
                        <th>Customer</th>
                        <th>Recipient</th>
                        <th>Status</th>
                        <th>Vibe</th>
                        <th>Place</th>
                        <th>Confirmed</th>
                        <th style="text-align:center;">Action</th>
                    </tr>
                </thead>
                <tbody id="responsesBody">
                    <tr><td colspan="8" class="empty-state"><div class="icon">💛</div><h3>Loading responses...</h3></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div class="toast hidden" id="toast"></div>

<script>
    const ADMIN_KEY = 'NOIR_ADMIN_2026';
    let responses = [];
    let selectedKeys = new Set();

    // ============================================================
    //  FETCH DATA
    // ============================================================
    async function fetchData() {
        try {
            const response = await fetch('/api/admin/plans', {
                headers: { 'x-admin-key': ADMIN_KEY }
            });

            if (!response.ok) {
                if (response.status === 401) {
                    showToast('❌ Unauthorized. Check admin key.', 'error');
                }
                throw new Error('Failed to fetch');
            }

            const data = await response.json();
            responses = data.plans || [];
            renderTable();
            updateStats();
        } catch (error) {
            console.error('Error fetching data:', error);
            showToast('❌ Error loading data', 'error');
        }
    }

    // ============================================================
    //  RENDER TABLE
    // ============================================================
    function renderTable() {
        const tbody = document.getElementById('responsesBody');

        if (responses.length === 0) {
            tbody.innerHTML = `
                <tr><td colspan="8" class="empty-state">
                    <div class="icon">💛</div>
                    <h3>No responses yet</h3>
                    <p style="color:#6a5a6a; font-size:13px;">Create a plan and share the link!</p>
                </td></tr>
            `;
            return;
        }

        tbody.innerHTML = responses.map(plan => {
            const isSelected = selectedKeys.has(plan.plan_key);
            const statusClass = plan.yes_clicked ? 'status-yes' : 
                               plan.page_viewed ? 'status-opened' : 'status-pending';
            const statusText = plan.yes_clicked ? '💛 YES!' : 
                               plan.page_viewed ? '👀 Opened' : '⏳ Pending';

            return `
                <tr class="${isSelected ? 'selected' : ''}">
                    <td class="checkbox-cell">
                        <input type="checkbox" 
                               data-key="${plan.plan_key}" 
                               ${isSelected ? 'checked' : ''} 
                               onchange="toggleRow('${plan.plan_key}')" />
                    </td>
                    <td>${plan.user_email || '—'}</td>
                    <td><strong>${plan.recipient || 'Your Date'}</strong></td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>${plan.vibe || '—'}</td>
                    <td>${plan.place || '—'}</td>
                    <td>${plan.confirmed_at ? '✅ Yes' : '⏳ Pending'}</td>
                    <td style="text-align:center;">
                        <button class="delete-btn" onclick="deletePlan('${plan.plan_key}')" title="Delete">🗑️</button>
                    </td>
                </tr>
            `;
        }).join('');

        updateSelectedCount();
    }

    // ============================================================
    //  UPDATE STATS
    // ============================================================
    function updateStats() {
        const total = responses.length;
        const yesCount = responses.filter(r => r.yes_clicked).length;
        const openedCount = responses.filter(r => r.page_viewed && !r.yes_clicked).length;
        const pendingCount = total - yesCount - openedCount;

        document.getElementById('totalCount').textContent = total;
        document.getElementById('yesCount').textContent = yesCount;
        document.getElementById('openedCount').textContent = openedCount;
        document.getElementById('pendingCount').textContent = pendingCount;
    }

    // ============================================================
    //  SELECTION FUNCTIONS
    // ============================================================
    function toggleRow(key) {
        if (selectedKeys.has(key)) {
            selectedKeys.delete(key);
        } else {
            selectedKeys.add(key);
        }
        renderTable();
        updateSelectedCount();
        updateDeleteButton();
    }

    function toggleSelectAll() {
        const checked = document.getElementById('selectAllCheckbox').checked;
        if (checked) {
            responses.forEach(r => selectedKeys.add(r.plan_key));
        } else {
            selectedKeys.clear();
        }
        renderTable();
        updateSelectedCount();
        updateDeleteButton();
    }

    function selectAll() {
        responses.forEach(r => selectedKeys.add(r.plan_key));
        document.getElementById('selectAllCheckbox').checked = true;
        renderTable();
        updateSelectedCount();
        updateDeleteButton();
    }

    function updateSelectedCount() {
        document.getElementById('selectedCount').textContent = `${selectedKeys.size} selected`;
    }

    function updateDeleteButton() {
        const btn = document.getElementById('deleteSelectedBtn');
        btn.disabled = selectedKeys.size === 0;
    }

    // ============================================================
    //  DELETE FUNCTIONS
    // ============================================================
    async function deletePlan(key) {
        if (!confirm('Delete this response?')) return;

        try {
            const response = await fetch(`/api/admin/delete-plan/${key}`, {
                method: 'DELETE',
                headers: { 'x-admin-key': ADMIN_KEY }
            });

            if (!response.ok) throw new Error('Delete failed');

            showToast(`✅ Deleted plan: ${key}`, 'success');
            selectedKeys.delete(key);
            await fetchData();
        } catch (error) {
            console.error('Error deleting:', error);
            showToast('❌ Failed to delete', 'error');
        }
    }

    async function deleteSelected() {
        const keys = Array.from(selectedKeys);
        if (keys.length === 0) return;
        if (!confirm(`Delete ${keys.length} selected response(s)?`)) return;

        try {
            const response = await fetch('/api/admin/delete-plans', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-key': ADMIN_KEY
                },
                body: JSON.stringify({ planKeys: keys })
            });

            if (!response.ok) throw new Error('Delete failed');

            showToast(`✅ Deleted ${keys.length} response(s)`, 'success');
            selectedKeys.clear();
            await fetchData();
        } catch (error) {
            console.error('Error deleting selected:', error);
            showToast('❌ Failed to delete selected', 'error');
        }
    }

    // ============================================================
    //  REFRESH
    // ============================================================
    function refreshData() {
        showToast('🔄 Refreshing...', '');
        fetchData();
    }

    // ============================================================
    //  TOAST NOTIFICATION
    // ============================================================
    function showToast(message, type = '') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.classList.remove('hidden');

        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }

    // ============================================================
    //  INIT
    // ============================================================
    fetchData();
</script>
</body>
</html>
