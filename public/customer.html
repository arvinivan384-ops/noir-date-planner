<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOIR · Your Date Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 20%, #1f1129, #0b0710);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            color: #f2ebe6;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(25, 15, 38, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #eecf8f;
            margin-bottom: 20px;
        }
        .status-card {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .status-icon { font-size: 48px; margin-bottom: 10px; }
        .status-text { font-size: 18px; font-weight: 600; color: #fff; }
        .status-sub { font-size: 13px; color: #a09cb0; margin-top: 5px; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 13px;
        }
        .detail-label { color: #8c859d; }
        .detail-value { color: #eecf8f; }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 30px;
            border-radius: 30px;
            background: rgba(238,207,143,0.1);
            border: 1px solid rgba(238,207,143,0.2);
            color: #eecf8f;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
        }
        .back-btn:hover { background: rgba(238,207,143,0.2); }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">✦ NOIR</div>
    <h2 style="font-family:'Playfair Display',serif; font-size:22px; color:#fff; margin-bottom:5px;">
        Your Date Status
    </h2>
    <p style="color:#8c859d; font-size:13px; margin-bottom:15px;">
        See if she said yes 💛
    </p>

    <div id="loading" style="color:#6a5a6a; padding:30px;">
        <i class="fas fa-spinner fa-spin"></i> Loading...
    </div>

    <div id="statusContent" style="display:none;">
        <div class="status-card">
            <div class="status-icon" id="statusIcon">⏳</div>
            <div class="status-text" id="statusText">Waiting...</div>
            <div class="status-sub" id="statusSub">She hasn't opened the page yet</div>
        </div>

        <div class="status-card" style="text-align:left;">
            <div class="detail-row">
                <span class="detail-label">👤 Recipient</span>
                <span class="detail-value" id="recipientName">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">📄 Page Viewed</span>
                <span class="detail-value" id="pageViewed">⏳</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">💛 Said YES</span>
                <span class="detail-value" id="yesClicked">⏳</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🎯 Vibe Chosen</span>
                <span class="detail-value" id="vibeChosen">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">📍 Place</span>
                <span class="detail-value" id="placeChosen">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">📅 Date Confirmed</span>
                <span class="detail-value" id="dateConfirmed">⏳</span>
            </div>
        </div>
    </div>

    <a href="/" class="back-btn">← Back to Home</a>
</div>

<script>
    // Get plan key from URL
    const urlParams = new URLSearchParams(window.location.search);
    const planKey = urlParams.get('plan');

    if (!planKey) {
        document.getElementById('loading').innerHTML = '❌ No plan key provided.';
    } else {
        fetchStatus(planKey);
    }

    async function fetchStatus(planKey) {
        try {
            const response = await fetch(`/api/customer/status/${planKey}`);
            
            if (!response.ok) {
                if (response.status === 404) {
                    document.getElementById('loading').innerHTML = '❌ Plan not found. Please check your link.';
                } else {
                    document.getElementById('loading').innerHTML = '❌ Error loading status. Please try again.';
                }
                return;
            }
            
            const data = await response.json();
            displayStatus(data);
        } catch (error) {
            document.getElementById('loading').innerHTML = '❌ Error loading status. Please try again.';
        }
    }

    function displayStatus(data) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('statusContent').style.display = 'block';

        document.getElementById('recipientName').textContent = data.recipient || 'Radhia';
        document.getElementById('pageViewed').textContent = data.page_viewed ? '✅ Yes' : '⏳ No';
        document.getElementById('yesClicked').textContent = data.yes_clicked ? '💛 YES!' : '⏳ Not yet';
        document.getElementById('vibeChosen').textContent = data.vibe_selected || '—';
        document.getElementById('placeChosen').textContent = data.place_selected || '—';
        document.getElementById('dateConfirmed').textContent = data.date_confirmed || '⏳ Not yet';

        // Update status icon and text
        const icon = document.getElementById('statusIcon');
        const text = document.getElementById('statusText');
        const sub = document.getElementById('statusSub');

        if (data.yes_clicked) {
            icon.textContent = '💛';
            text.textContent = 'She said YES! 🎉';
            sub.textContent = `She confirmed on ${new Date(data.confirmed_at || Date.now()).toLocaleDateString()}`;
        } else if (data.page_viewed) {
            icon.textContent = '👀';
            text.textContent = 'She opened the page';
            sub.textContent = 'Waiting for her to say yes... 💛';
        } else {
            icon.textContent = '⏳';
            text.textContent = 'Waiting...';
            sub.textContent = 'She hasn\'t opened the page yet';
        }
    }

    // Auto-refresh every 15 seconds
    setInterval(() => {
        if (planKey) fetchStatus(planKey);
    }, 15000);
</script>
</body>
</html>
